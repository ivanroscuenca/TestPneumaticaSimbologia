<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6fb;--card:#fff;--tx:#1b2433;--mu:#5b6678;--ac:#1f5fbf;--ok:#1e8e4e;--ko:#c0392b;--bd:#d5dce8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161d;--card:#1b222d;--tx:#e8edf5;--mu:#9aa6b8;--ac:#6ea8ff;--ok:#4cc27d;--ko:#ff7b6b;--bd:#2f3a4b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161d;--card:#1b222d;--tx:#e8edf5;--mu:#9aa6b8;--ac:#6ea8ff;--ok:#4cc27d;--ko:#ff7b6b;--bd:#2f3a4b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px}.im{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;margin-bottom:10px}.im img{max-width:100%;max-height:150px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 16%,var(--card))}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;margin-top:10px;font-weight:600}
.sec{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:11px 18px;margin:10px 8px 0 0}
.big{font-size:2.4rem;font-weight:700;color:var(--ac)}
ul{padding-left:18px}li{margin:6px 0}
</style></head><body><main>

const $=document.getElementById("app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(c){const d=shuf(D.filter(x=>x[0]===c[0]&&x[1]!==c[1])).slice(0,3);return{n:c[1],img:c[2],o:shuf([c[1],...d.map(x=>x[1])])}}
let deck,i,score,fails,done;
function start(list){deck=list.map(x=>x.o?{...x,o:shuf(x.o)}:mk(x));deck=shuf(deck);i=0;score=0;fails=[];done=false;show()}
function home(){$.innerHTML=`<div class="q">${D.length} símbolos del apartado 2.4</div><div class="sub">Se muestra el símbolo del PDF y eliges su nombre. Las opciones falsas son del mismo grupo.</div><button class="pri" id="a">Test completo (${D.length})</button><button class="sec" id="b" style="margin-left:8px">Test rápido (20)</button>`;
 document.getElementById("a").onclick=()=>start(D);document.getElementById("b").onclick=()=>start(shuf(D).slice(0,20))}
function show(){
 if(i>=deck.length){const p=Math.round(score/deck.length*100);
  $.innerHTML=`<div class="meta">Resultado</div><div class="big">${score}/${deck.length} · ${p}%</div>${fails.length?`<div class="sub">Falladas:</div><ul>${fails.map(f=>`<li><img src="${f.img}" style="height:34px;vertical-align:middle;background:#fff;border-radius:4px"> <b>${f.n}</b></li>`).join("")}</ul><button class="pri" id="rf">Repetir falladas</button>`:"<p>¡Sin fallos!</p>"}<button class="sec" id="rs">Inicio</button>`;
  if(fails.length)document.getElementById("rf").onclick=()=>start(fails);
  document.getElementById("rs").onclick=home;return}
 const c=deck[i];done=false;
 $.innerHTML=`<div class="meta"><span>Pregunta ${i+1} de ${deck.length}</span><span>Aciertos: ${score}</span></div><div class="bar"><i style="width:${i/deck.length*100}%"></i></div><div class="q">¿Qué representa este símbolo?</div><div class="im"><img src="${c.img}" alt="Símbolo"></div>${c.o.map((t,k)=>`<button class="opt" data-k="${k}">${"abcd"[k]}) ${t}</button>`).join("")}<div id="nx"></div>`;
 $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,c));
}
function pick(b,c){
 if(done)return;done=true;
 const ok=c.o[b.dataset.k]===c.n;
 if(ok)score++;else fails.push(c);
 $.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(c.o[x.dataset.k]===c.n)x.classList.add("ok")});
 if(!ok)b.classList.add("ko");
 $.querySelector("#nx").innerHTML=`<button class="pri" id="n">${i+1<deck.length?"Siguiente":"Ver resultado"}</button>`;
 document.getElementById("n").onclick=()=>{i++;show()};
}
home();
</script></body></html>
